# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: Label Studio
version: "1.1.1"
slug: label_studio
description: Design and print labels on a USB DYMO LabelWriter, from Home Assistant
url: https://github.com/madeby0203/ha-label-studio/tree/main/label_studio
arch:
  - aarch64
  - amd64
image: ghcr.io/madeby0203/ha-label-studio
startup: services
init: false
ingress: true
panel_title: Label Studio
# The sidebar only takes built-in MDI icons; the brand's peel-label mark is in the app's title bar.
panel_icon: mdi:label-outline
# The optional network printer announces itself over mDNS, which only reaches the LAN on the host network.
host_network: true
usb: true
# Renders Home Assistant templates in labels.
homeassistant_api: true
# Uses the Mosquitto broker app automatically when no broker is configured.
services:
  - mqtt:want
options:
  backend: direct
  device: /dev/usb/lp0
  cups_printer: DYMO
  fallback_cups: false
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
schema:
  backend: list(direct|cups)
  device: str
  cups_printer: str
  fallback_cups: bool
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
